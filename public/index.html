<style>
:root{--bg:#0d0e14;--panel:#161823;--panel2:#1d2030;--line:#2a2e42;--txt:#e6e8f0;--mut:#9097b0;--acc:#5b8def;--good:#5fd38d;--bad:#ff6b6b;--gold:#ffd24a;--deep:#0a0b10;--bgimg:none}
body{background:var(--bgimg),var(--bg)!important;background-attachment:fixed!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,sans-serif;font-size:15.5px}
h1,h2,h3,.fl,.cur,.bar>span,.ab,.btn.pri,.tab,.lbl,.sg b,.kv b{font-family:'Pixelify Sans',Rubik,sans-serif}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mut{color:var(--mut)} .good{color:var(--good)} .bad{color:var(--bad)} .gold{color:var(--gold)}
h1,h2,h3{margin:0}
/* Title */
.title{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 16px;gap:26px}
.title h1{font-size:clamp(30px,6vw,54px);font-weight:800;letter-spacing:-1px;text-align:center}
.title h1 span{background:linear-gradient(90deg,#5b8def,#3fc6a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sccards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.sccard{width:310px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;transition:transform .15s,border-color .15s}
.sccard:hover{transform:translateY(-3px);border-color:var(--c)}
.sccard .ic{font-size:46px}
.sccard h2{font-size:22px;margin:8px 0 6px}
.sccard p{color:var(--mut);margin:0 0 14px;line-height:1.45}
.sccard .meta{display:flex;gap:14px;font-size:13px}
.savebadge{font-size:12px;color:var(--mut)}
/* Hub */
.hub{max-width:1180px;margin:0 auto;padding:16px}
.hubtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.hubtop h2{font-size:22px}
.cur{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:8px;padding:8px 14px;color:var(--mut)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--txt)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.clsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.cls{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.cls.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.cls.lock{opacity:.5}
.cls .ic{font-size:44px;min-height:72px}
.cls h3{font-size:17px;margin:4px 0}
.cls ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:12.5px;line-height:1.5}
.statrow{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.heatrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.heat{min-width:40px}
.heat.on{background:#c0503f;border-color:#c0503f;color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:8px}
.best div{background:var(--panel2);border-radius:8px;padding:6px 8px;font-size:12.5px}
input.inp{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;margin-bottom:6px}
input.inp:focus{outline:none;border-color:var(--acc)}
.accbox{display:flex;align-items:center;gap:8px;font-size:13px}
textarea{width:100%;min-height:80px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:monospace;font-size:11px}
/* Tree */
.treewrap{display:grid;grid-template-columns:1fr 300px;gap:12px}
.treecv{position:relative;height:72vh;min-height:420px;background:radial-gradient(circle at center,#1a1c29,#0b0c12 70%);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
.treecv canvas{width:100%;height:100%;display:block;cursor:grab}
.treebtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.treebtns .btn{width:36px;height:36px;padding:0}
.treeinfo{display:flex;flex-direction:column;gap:12px;max-height:72vh;overflow:auto}
.ninfo h3{font-size:17px;margin-bottom:2px}
.ninfo .typ{font-size:12px;color:var(--mut);margin-bottom:8px}
.ninfo ul{margin:6px 0;padding-left:18px;line-height:1.6}
.sumlist{font-size:12.5px;line-height:1.7;columns:1}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
/* Game */
.game{display:flex;flex-direction:column;height:100vh}
.gtop{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.gtop .fl{font-weight:700;font-size:19px}
.gmain{flex:1;display:flex;min-height:0}
.cvwrap{flex:1;position:relative;min-width:0}
#cv{display:block;width:100%;height:100%}
#side{width:400px;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:10px}
.bar{height:22px;background:var(--deep);border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar>span{position:absolute;inset:0;font-size:13px;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:#fff!important;font-weight:600;text-shadow:0 1px 2px #000}
.lbl{font-size:12px;color:var(--mut);margin:2px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13.5px}
.sg b{font-weight:600}
.abils{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ab{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:13.5px;line-height:1.25;text-align:center}
.ab:hover:not(:disabled){border-color:var(--acc)}
.ab:disabled{opacity:.4}
.ab .k{font-size:10px;color:var(--mut)}
.eqrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.eqrow .slot{height:50px;cursor:pointer}.eqrow .slot small{font-size:8.5px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;height:58px;font-size:28px;display:flex;align-items:center;justify-content:center;position:relative}
.slot small{position:absolute;bottom:1px;font-size:9px;color:var(--mut)}
.inv{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.inv .slot{height:48px;font-size:24px}
.r1{border-color:#5fd38d!important;box-shadow:inset 0 0 8px #5fd38d55}
.r2{border-color:#6ea8ff!important;box-shadow:inset 0 0 8px #6ea8ff55}
.r3{border-color:#c77dff!important;box-shadow:inset 0 0 10px #c77dff66}
.r4{border-color:#ffd24a!important;box-shadow:inset 0 0 12px #ffd24a77}
.r5{border-color:#ff4d4d!important;box-shadow:inset 0 0 14px #ff4d4d88}
.trash .inv .slot{border-color:#ff6b6b88}
.mini{width:100%;display:block;image-rendering:pixelated;background:var(--deep);border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.info{background:var(--panel2);border-radius:8px;padding:10px;font-size:13.5px;min-height:54px;line-height:1.5}
.log{font-size:13.5px;line-height:1.5;max-height:200px;overflow:auto;background:var(--deep);border-radius:8px;padding:6px 8px}
.log div{border-bottom:1px solid #1b1d29;padding:1px 0}
.log .bad{color:#ff8f8f}.log .good{color:#7ee2a6}.log .abil{color:#9fc2ff}.log .loot{color:#ffd77a}
.buffs{display:flex;gap:4px;flex-wrap:wrap;font-size:11px}
.buffs span{background:var(--panel2);border-radius:6px;padding:2px 6px}
.dpad{position:absolute;left:10px;bottom:10px;display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:4px;opacity:.85}
.dpad button{background:#1d2030cc;border:1px solid var(--line);border-radius:10px;font-size:18px}
.stairsbtn{width:100%}
@media (pointer:coarse),(max-width:820px){.dpad{display:grid}}
@media (max-width:820px){.gmain{flex-direction:column}.cvwrap{height:56vh;flex:none}#side{width:auto;border-left:0;border-top:1px solid var(--line)}.game{height:auto;min-height:100vh}.treewrap{grid-template-columns:1fr}.treeinfo{max-height:none}}
.qm{position:absolute;top:0;right:4px;font-size:10px;color:#ffd24a}
.shoprow{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px}
.sic{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:6px;flex:none}
.sinfo{flex:1;line-height:1.4}
.shopinv{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}.slot .spr{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:#ffd24a;text-shadow:0 1px 0 #000;pointer-events:none}.shoprow[data-hov]{cursor:help}
.fchips{display:flex;flex-wrap:wrap;gap:4px}.fchip{background:var(--panel2);border-radius:6px;padding:3px 7px;font-size:12px}.fchip.dz{background:#4a1f2e}.fchip.bz{outline:1px solid var(--gold)}
.relgrid{display:flex;flex-wrap:wrap;gap:6px}.relc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;text-align:left;line-height:1.4}.relc.on{border-color:var(--gold);box-shadow:0 0 0 2px #ffd24a33}
.jw{background:var(--panel2);border-radius:8px;padding:8px;margin-top:6px;font-size:12.5px;line-height:1.5}
.attrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:8px}
.attr{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#bt{position:absolute;inset:0;display:none;z-index:20}#bt.on{display:block}
#btc,#bfx{position:absolute;inset:0}#bfx{pointer-events:none}
.bt{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:12px}
.btl{position:relative;height:52px;flex:none;background:#000a;border:1px solid var(--line);border-radius:10px}
.btl .trk{position:absolute;left:54px;right:16px;top:50%;height:4px;background:linear-gradient(90deg,#ffd24a,#ffffff22);border-radius:2px}
.btl .mk{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .06s linear;filter:drop-shadow(0 2px 2px #000)}
.btl .now{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:'Pixelify Sans',sans-serif;font-size:14px;color:#ffd24a}
.bfield{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.bten{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:flex-end;padding-right:4%}
.btpl{display:flex;align-items:flex-end;gap:12px;padding-left:3%}
.bcard{position:relative;background:#0009;border:2px solid transparent;border-radius:12px;padding:8px 10px;text-align:center;min-width:130px;cursor:pointer}
.bcard.sel{border-color:#ffd24a;box-shadow:0 0 14px #ffd24a66}
.bcard .bspr{display:flex;justify-content:center}.bcard .bspr::after{content:'';position:absolute}
.bcard .bn{font-family:'Pixelify Sans',sans-serif;font-size:13.5px;margin-top:2px;max-width:220px}
.hpb{height:8px;background:#000;border-radius:4px;overflow:hidden;margin-top:4px}.hpb i{display:block;height:100%;background:#e5534b;transition:width .25s}
.bcard.act{animation:lunge .32s}.bcard.hit{animation:shake .3s}
.btlog{flex:1;font-size:13px;background:#000a;border-radius:8px;padding:6px 10px;max-height:96px;overflow:hidden;align-self:stretch}
.btmenu{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;min-height:40px;align-items:center}
.btitems{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bwin{font-family:'Pixelify Sans',sans-serif;font-size:26px;color:#ffd24a}
.bfl{position:absolute;transform:translateX(-50%);font-family:'VT323','Pixelify Sans',monospace;font-weight:400;font-size:32px;text-shadow:0 2px 0 #000,0 0 4px #000;animation:bfl .9s forwards;white-space:nowrap;z-index:3}
.bintro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Pixelify Sans',sans-serif;font-size:56px;font-weight:700;color:#fff;text-shadow:0 4px 0 #000;animation:bintro .75s forwards;background:radial-gradient(circle,#ffffff22,#0000 60%);pointer-events:none}
@keyframes bfl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}
@keyframes lunge{50%{transform:translateY(-16px) scale(1.07)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bintro{0%{opacity:0;transform:scale(2.2)}30%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (max-width:820px){.bcard{min-width:96px;padding:6px}.bcard .bn{font-size:12px}}
.tip{position:fixed;z-index:200;display:none;max-width:360px;background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.55;pointer-events:none;box-shadow:0 8px 24px #000a}
.quick{display:flex;flex-wrap:wrap;gap:5px}.quick .slot{width:46px;height:46px}
.charbox{max-width:1180px;background:linear-gradient(180deg,var(--panel),var(--bg))}
.chargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;align-items:start}
.ccol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.ccol h3{font-size:17px;margin-bottom:8px}
.cgrp{margin-bottom:10px}.cgrp .kv{padding:4px 0;font-size:14px;gap:12px}.cgrp .kv b{white-space:nowrap;text-align:right}
.ceff{font-size:12.5px;line-height:1.45;background:var(--panel2);border-radius:8px;padding:6px 8px;margin-top:4px}
.doll{display:grid;grid-template-columns:repeat(3,minmax(72px,1fr));gap:8px;max-width:320px;margin:0 auto;grid-template-areas:". helm ." "shoulder chest neck" "gloveL belt gloveR" "main legs off" "ring1 boots ring2" ". talis ."}
.doll .slot{height:76px;cursor:pointer;background:var(--panel);flex-direction:column;justify-content:center;gap:2px}.doll .slot small{position:static;font-size:10.5px}
.cs-helm{grid-area:helm}.cs-shoulder{grid-area:shoulder}.cs-chest{grid-area:chest}.cs-neck{grid-area:neck}.cs-gloveL{grid-area:gloveL}.cs-belt{grid-area:belt}.cs-gloveR{grid-area:gloveR}
.cs-main{grid-area:main}.cs-legs{grid-area:legs}.cs-off{grid-area:off}.cs-ring1{grid-area:ring1}.cs-boots{grid-area:boots}.cs-ring2{grid-area:ring2}.cs-talis{grid-area:talis}
.cinv{grid-template-columns:repeat(5,minmax(0,1fr))!important}.cinv .slot{height:58px;background:var(--panel)}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(5,6,10,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
.box h2{margin-bottom:10px}
.boons{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.boon{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.boon:hover{border-color:var(--gold)}
.boon b{display:block;font-size:15px;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222638;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px}

 --np:4px;clip-path:polygon(0 var(--np),var(--np) var(--np),var(--np) 0,calc(100% - var(--np)) 0,calc(100% - var(--np)) var(--np),100% var(--np),100% calc(100% - var(--np)),calc(100% - var(--np)) calc(100% - var(--np)),calc(100% - var(--np)) 100%,var(--np) 100%,var(--np) calc(100% - var(--np)),0 calc(100% - var(--np)))}

.tab{background:var(--panel)!important;color:var(--mut)!important;padding:8px 14px}

const RAD=r=>40+r*52;
let TREE=null;
function buildTree(){
 const nodes=[],adj=[];
 const add=n=>{n.id=nodes.length;nodes.push(n);adj.push([]);return n};
 const link=(a,b)=>{if(a!==b&&!adj[a].includes(b)){adj[a].push(b);adj[b].push(a)}};
 add({t:'start',x:0,y:0,s:-1,mods:{}});
 const RINGS=12,grid=[];
 for(let s=0;s<6;s++){grid[s]=[];
  for(let r=1;r<=RINGS;r++){const n=1+Math.floor(r*0.75),ids=[];
   const notK=r===4?[1,2]:r===7?[2,4]:r===10?[2,5]:[];
   for(let k=0;k<n;k++){
    const a=(-90+s*60+(k+0.5)/n*60)*Math.PI/180;const isN=notK.indexOf(k);let node;
    if(isN>=0){const t=r===4?1:r===7?2:3;node={t:'notable',s,tier:t,ni:s*6+(t-1)*2+isN,mods:notableMods(s,t,isN)}}
    else{const v=((r*7+k*13+s*3)%5===0)?2:(r+k)%2;node={t:'small',s,mods:SMALL[s][v]}}
    node.x=Math.cos(a)*RAD(r);node.y=Math.sin(a)*RAD(r);node.a=a;node.r=r;
    ids.push(add(node).id)}
   grid[s][r]=ids}}
 for(let s=0;s<6;s++)for(let r=1;r<=RINGS;r++){const ids=grid[s][r];
  ids.forEach(id=>{if(r===1)link(0,id);else{const prev=grid[s][r-1];let best=prev[0],bd=1e9;prev.forEach(p=>{const d=Math.abs(nodes[p].a-nodes[id].a);if(d<bd){bd=d;best=p}});link(best,id)}});
  if(r%2===0)for(let k=0;k<ids.length-1;k++)link(ids[k],ids[k+1]);
  if(r%3===0)link(ids[ids.length-1],grid[(s+1)%6][r][0]);}
 for(let s=0;s<6;s++){const ids=grid[s][RINGS];const a=(-90+s*60+30)*Math.PI/180;
  const ks=add({t:'key',s,x:Math.cos(a)*RAD(RINGS+1.6),y:Math.sin(a)*RAD(RINGS+1.6),mods:{},flag:KS[s].f});
  link(ks.id,ids[4]);link(ks.id,ids[5]);}
 for(let s=0;s<6;s++)for(const rr of [5.5,9.5]){const a=(-90+s*60+30)*Math.PI/180;const n=add({t:'socket',s,x:Math.cos(a)*RAD(rr),y:Math.sin(a)*RAD(rr),mods:{},a});
  for(const r of [Math.floor(rr),Math.ceil(rr)]){const ids=grid[s][r].slice().sort((p,q)=>Math.abs(nodes[p].a-a)-Math.abs(nodes[q].a-a));link(n.id,ids[0])}}
 {const s=4,a=(-90+s*60+30)*Math.PI/180;[[3.5,3],[7.5,4],[11.5,5]].forEach(([rr,tier])=>{const n=add({t:'unlock',s,tier,x:Math.cos(a)*RAD(rr),y:Math.sin(a)*RAD(rr),mods:{rareFind:10},a});
  for(const r of [Math.floor(rr),Math.ceil(rr)]){const ids=grid[s][r].slice().sort((p,q)=>Math.abs(nodes[p].a-a)-Math.abs(nodes[q].a-a));link(n.id,ids[0])}})}
 TREE={nodes,adj};
}

const PXBG={};
function pixelBg(key,t){if(PXBG[key])return PXBG[key];let u='none';try{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');const b=hexRgb(t.bg),l=hexRgb(t.line);
 for(let yy=0;yy<32;yy++)for(let xx=0;xx<32;xx++){const h=hsh(xx,yy,key==='island'?11:5);let col=b,f=1;if(h>.965){col=l;f=.9}else if(h>.86)f=1.18;else if(h<.07)f=.82;
  x.fillStyle=`rgb(${col.map(v=>Math.min(255,v*f|0)).join(',')})`;x.fillRect(xx,yy,1,1)}u=`url(${c.toDataURL()})`}catch(e){}return PXBG[key]=u}
function setAcc(){const r=document.documentElement.style;r.setProperty('--acc',SC?(SC.id==='island'?'#1c9c86':SC.color):'#5b8def');const key=SC?SC.id:'base';const t=Object.assign({good:'#5fd38d',bad:'#ff6b6b',gold:'#ffd24a',hi:'rgba(255,255,255,.10)',sh:'rgba(0,0,0,.38)'},THEMES[key]||THEMES.base);for(const k in t)r.setProperty('--'+k,t[k]);document.body.dataset.th=key;r.setProperty('--bgimg',pixelBg(key,t))}
/* --- Emojis im Text automatisch als Pixel-Icons --- */
const EMOJI_RE=/(\p{Extended_Pictographic}(?:\uFE0F|\u20E3|\p{Emoji_Modifier}|\u200D\p{Extended_Pictographic}\uFE0F?)*)/gu;
const PX_SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','CANVAS','OPTION']);
function pixelizeNode(root){if(!root||root.nodeType!==1&&root.nodeType!==3)return;if(root.nodeType===3)root=root.parentNode;if(!root||!root.isConnected)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{let e=n.parentNode;while(e&&e!==document.body){if(PX_SKIP.has(e.tagName)||(e.classList&&e.classList.contains('num')))return NodeFilter.FILTER_REJECT;e=e.parentNode}EMOJI_RE.lastIndex=0;return EMOJI_RE.test(n.nodeValue)||/\d/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
 const list=[];while(tw.nextNode())list.push(tw.currentNode);
 for(const n of list){const parts=n.nodeValue.split(EMOJI_RE);const fr=document.createDocumentFragment();let any=false;
  const addText=txt=>{const ps=txt.split(/(\d+(?:[.,:]\d+)*)/);ps.forEach((q,j)=>{if(!q)return;if(j%2===1){const sp=document.createElement('span');sp.className='num';sp.textContent=q;fr.appendChild(sp);any=true}else fr.appendChild(document.createTextNode(q))})};
  parts.forEach((pt,i)=>{if(!pt)return;if(i%2===1){const c=sprCanvas(pt);let u=null;if(c){if(!SPRU.has(pt)){try{SPRU.set(pt,c.toDataURL())}catch(e){SPRU.set(pt,'')}}u=SPRU.get(pt)}
   if(u){const im=document.createElement('img');im.src=u;im.className='pxe';im.alt=pt;fr.appendChild(im);any=true}else fr.appendChild(document.createTextNode(pt))}else addText(pt)});
  if(any&&n.parentNode)n.parentNode.replaceChild(fr,n)}}
let PXOBS=null;
function startPixelizer(){if(PXOBS||typeof MutationObserver==='undefined')return;pixelizeNode(document.body);PXOBS=new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(n=>pixelizeNode(n))});PXOBS.observe(document.body,{childList:true,subtree:true})}

const TV={x:0,y:0,z:.5,sel:null,hover:null,ptrs:new Map(),moved:false,last:null,pinch:null,path:null};
function treeTabHTML(){
 return `<div class="treewrap"><div class="treecv" id="tcvw"><canvas id="tcv"></canvas>
 <div class="treesearch"><input id="tq" type="search" placeholder="🔍 Suchen, z. B. Dornen" value="${esc(TV.q||'')}" autocomplete="off"><span id="tqn" class="mut"></span><button class="btn sm" data-a="tqPrev" title="Vorheriger Treffer">◀</button><button class="btn sm" data-a="tqNext" title="Nächster Treffer (Enter)">▶</button></div>

function initTreeView(){
 const cv=$('#tcv'),wrap=$('#tcvw');if(!cv)return;
 const resize=()=>{const r=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;drawTree()};
 TV.fit=()=>{const r=wrap.getBoundingClientRect();TV.z=Math.min(r.width,r.height)/(2*RAD(16.8))*(isMob()?2.2:1);TV.x=0;TV.y=0};
 if(!TV.inited){TV.fit();TV.inited=true}
 resize();new ResizeObserver(resize).observe(wrap);
 const world=(e)=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-r.width/2-TV.x)/TV.z,y:(e.clientY-r.top-r.height/2-TV.y)/TV.z}};
 const hit=(e)=>{const w=world(e);let best=null,bd=1e9;for(const n of TREE.nodes){const rr=nodeR(n)+5/TV.z;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<rr&&d<bd){bd=d;best=n}}return best};
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);TV.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});TV.moved=false;TV.last={x:e.clientX,y:e.clientY};if(TV.ptrs.size===2){const p=[...TV.ptrs.values()];TV.pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
 cv.addEventListener('pointermove',e=>{
  if(TV.ptrs.has(e.pointerId)){TV.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(TV.ptrs.size===2&&TV.pinch){const p=[...TV.ptrs.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);zoomAt(d/TV.pinch,null);TV.pinch=d;TV.moved=true;return}
   const dx=e.clientX-TV.last.x,dy=e.clientY-TV.last.y;if(Math.abs(dx)+Math.abs(dy)>3||TV.moved){TV.moved=true;TV.x+=dx;TV.y+=dy;TV.last={x:e.clientX,y:e.clientY};drawTree()}
  }else{const n=hit(e);if(n!==TV.hover){TV.hover=n;cv.style.cursor=n?'pointer':'grab';updatePathPreview();drawTree();updateNInfo()}}});
 const up=e=>{const wasMoved=TV.moved;TV.ptrs.delete(e.pointerId);if(TV.ptrs.size<2)TV.pinch=null;
  if(!wasMoved&&e.type==='pointerup'){const n=hit(e);treeClick(n)}};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('pointerleave',()=>{if(!TV.ptrs.size&&TV.hover){TV.hover=null;updatePathPreview();drawTree();updateNInfo()}});
 cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e)},{passive:false});
 updateNInfo();updateTreeSum();
}
function zoomAt(f,e){const cv=$('#tcv');if(!cv)return;const nz=Math.max(.18,Math.min(2.5,TV.z*f));const r=cv.getBoundingClientRect();
 const mx=e?e.clientX-r.left-r.width/2:0,my=e?e.clientY-r.top-r.height/2:0;const k=nz/TV.z;TV.x=mx-(mx-TV.x)*k;TV.y=my-(my-TV.y)*k;TV.z=nz;drawTree()}
const nodeR=n=>n.t==='unlock'?16:n.t==='socket'?12:n.t==='key'?19:n.t==='notable'?13:n.t==='start'?17:7;
function allocSet(){return new Set(scS().tree)}
function findPath(target){const A=allocSet();if(A.has(target))return null;const par=new Map();const q=[];for(const a of A){q.push(a);par.set(a,-1)}
 let qi=0;while(qi<q.length){const c=q[qi++];if(c===target)break;for(const nb of TREE.adj[c]){if(par.has(nb))continue;par.set(nb,c);q.push(nb)}}
 if(!par.has(target))return null;const path=[];let c=target;while(c!==-1&&!A.has(c)){path.push(c);c=par.get(c)}return path.reverse()}
const pathCost=p=>p.reduce((s,id)=>s+nodeCost(TREE.nodes[id]),0);
function updatePathPreview(){const n=TV.hover||TV.sel;TV.path=n?findPath(n.id):null}
function canUnalloc(id){if(id===0)return false;const nn=TREE.nodes[id];if(nn.t==='unlock'&&scS().tree.some(x=>{const q=TREE.nodes[x];return q.t==='unlock'&&q.tier>nn.tier}))return false;const A=allocSet();A.delete(id);const seen=new Set([0]);const q=[0];while(q.length){const c=q.pop();for(const nb of TREE.adj[c])if(A.has(nb)&&!seen.has(nb)){seen.add(nb);q.push(nb)}}return seen.size===A.size}
function treeClick(n){
 if(!n){TV.sel=null;updatePathPreview();drawTree();updateNInfo();return}
 TV.sel=n;const d=scS();
 if(!d.tree.includes(n.id)){const p=findPath(n.id);if(p){const c=pathCost(p);if(unlockBlocked(p,d))toast('Erst die vorherige Rarität freischalten (Episch → Legendär → Mythisch).');else if(c<=ptsFree(d)){d.tree.push(...p);saveSoon();toast(p.length>1?`${p.length} Knoten gelernt (−${c} 🌟)`:`${nodeName(n)} gelernt (−${c} 🌟)`)}else toast(`Nicht genug Skillpunkte: ${c} benötigt, ${ptsFree(d)} frei`)}}
 updatePathPreview();drawTree();updateNInfo();updateTreeSum();updCur();
}
function treeUnalloc(){const n=TV.sel;if(!n)return;const d=scS();if(!d.tree.includes(n.id))return;if(!canUnalloc(n.id)){toast('Das würde den Baum trennen – zuerst äußere Knoten verlernen.');return}
 d.tree=d.tree.filter(i=>i!==n.id);delete d.sockets[n.id];saveSoon();updatePathPreview();drawTree();updateNInfo();updateTreeSum();updCur()}
function updCur(){const e=$('#curDisp');if(e)e.textContent=`${SC.curI} ${scS().cur} ${SC.cur} · 🌟 ${ptsFree(scS())}`}
function updateNInfo(){const box=$('#ninfo');if(!box)return;const n=TV.hover||TV.sel;const d=scS();
 if(!n){box.innerHTML=`<h3>${SC.icon} Skillbaum</h3><div class="typ">${d.tree.length-1} von ${TREE.nodes.length-1} Knoten gelernt</div><div class="hint">Fahre über einen Knoten oder tippe ihn an. Sechs Bereiche, jeweils mit 6 Knotenpunkten und einem Schlüsselstein ganz außen.</div>`;return}
 const owned=d.tree.includes(n.id);const p=owned?null:findPath(n.id);const c=p?pathCost(p):0;
 let act='';if(owned&&n.t!=='start')act=TV.sel===n?`<button class="btn sm" data-a="treeUn">Verlernen (+${nodeCost(n)} 🌟)</button>`:'<span class="mut">Antippen, um zu verlernen</span>';
 else if(p)act=`<div style="margin-top:6px">${p.length>1?`Pfad: <b>${p.length}</b> Knoten · `:''}Kosten: <b class="${c<=ptsFree(d)?'good':'bad'}">${c} 🌟</b> <span class="mut">(${ptsFree(d)} frei)</span></div>`;
 box.innerHTML=`<h3 style="color:${n.s>=0?SCOL[n.s]:'#fff'}">${esc(nodeName(n))}</h3><div class="typ">${nodeType(n)} ${owned?'· <span class="good">gelernt</span>':''}</div><ul>${nodeLines(n).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>${act}${sockUI(n,owned)}`}
function updateTreeSum(){const box=$('#tsum');if(!box)return;const {m,f}=treeMods(scS());const lines=modLines(m);Object.keys(f).forEach(fl=>{const i=KS.findIndex(k=>k.f===fl);lines.push('🔷 '+SC.keystones[i]+': '+T(KS[i].d))});box.innerHTML=lines.length?lines.map(l=>esc(l)).join('<br>'):'<span class="mut">Noch nichts gelernt.</span>'}
function drawTree(){
 const cv=$('#tcv');if(!cv)return;const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;const W=cv.width/dpr,H=cv.height/dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);const LT=document.body.dataset.th==='island';const TP=LT?{e0:'#b8995e',e1:'#9a6a14',e2:'#127566',e3:'#8a6a38',off:'#efdeb4',hi:'#3b2812',sock:'#6b4a22',lab:'99'}:{e0:'#2c2f40',e1:'#e8d48a',e2:'#7fe3ff',e3:'#5d6280',off:'#1b1d2a',hi:'#ffffff',sock:'#cfd3ff',lab:'66'};
 ctx.translate(W/2+TV.x,H/2+TV.y);ctx.scale(TV.z,TV.z);
 const A=allocSet();const avail=new Set();A.forEach(a=>TREE.adj[a].forEach(nb=>{if(!A.has(nb))avail.add(nb)}));
 const P=new Set(TV.path||[]);
 // sector labels
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(let s=0;s<6;s++){const a=(-90+s*60+30)*Math.PI/180;ctx.fillStyle=SCOL[s]+TP.lab;ctx.font='700 30px Rubik,sans-serif';ctx.fillText(SC.sect[s].toUpperCase(),Math.cos(a)*RAD(15.6),Math.sin(a)*RAD(15.6))}
 // edges

 AUD.master=c.createGain();AUD.master.connect(comp);
 AUD.mus=c.createGain();AUD.musDuck=c.createGain();AUD.mus.connect(AUD.musDuck);AUD.musDuck.connect(AUD.master);

const NIDX={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){const m=/^([A-G])([#b]?)(-?\d)$/.exec(n);if(!m)return 0;const s=NIDX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(s-69)/12)}
function chordOf(c){const m=/^([A-G][#b]?)(m|dim)?$/.exec(c);const r=nf(m[1]+'2');const iv=m[2]==='m'?[0,3,7]:m[2]==='dim'?[0,3,6]:[0,4,7];return{r,iv}}
const semi=(f,s)=>f*Math.pow(2,s/12);

function voice(dest,t,f,dur,o={}){const c=AUD.ctx;if(!f)return;const os=c.createOscillator(),g=c.createGain();
 if(AUD.soft&&o.w&&o.w[0]==='p')o=Object.assign({},o,{w:o.w==='p50'?'sine':'tri'});
 if(o.w==='tri'||o.w==='sine'||o.w==='saw')os.type=o.w==='tri'?'triangle':o.w==='saw'?'sawtooth':'sine';else os.setPeriodicWave(AUD.w[o.w||'p25']);
 os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
 if(o.det)os.detune.value=o.det;
 if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.5;lg.gain.value=f*.012*o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t+.08);l.stop(t+dur+.1)}
 const v=o.v||.2,a=o.a||.005,rel=o.r||.06;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setTargetAtTime(v*(o.s??.6),t+a,o.d||.08);g.gain.setTargetAtTime(0,t+Math.max(a,dur-rel*.3),rel);
 os.connect(g);g.connect(dest);if(o.echo)g.connect(AUD.echo);os.start(t);os.stop(t+dur+rel*4)}
function noise(dest,t,dur,o={}){const c=AUD.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AUD.noise;
 f.type=o.ft||'highpass';f.frequency.setValueAtTime(o.f||6000,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);if(o.q)f.Q.value=o.q;
 const v=o.v||.2;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}

function musicWanted0(){if(typeof APP==='undefined')return null;if(APP.screen!=='game'||!G)return 'hub';if(G.over)return null;
 if(G.battle){if(G.arena)return 'battle';if(G.battle.en.some(e=>e.ghost))return 'ghost';if(G.battle.en.some(e=>e.boss))return 'boss';return 'battle'}

 if(w!==AUD.want){AUD.want=w;const t=c.currentTime;AUD.mus.gain.setTargetAtTime(0,t,.08);AUD.switchAt=t+.35}
 if(AUD.switchAt&&c.currentTime>=AUD.switchAt){AUD.switchAt=0;AUD.songId=AUD.want;AUD.song=SONGS[AUD.want]||null;AUD.step=0;AUD.next=c.currentTime+.05;sndApply()}
 const s=AUD.song;if(!s||AUD.switchAt)return;const fl=G&&APP.screen==='game'&&!G.battle?G.floor:1;const sd=60/(s.bpm*(1+.012*(fl-1)))/4;
 while(AUD.next<c.currentTime+.15){musStep(s,AUD.step,AUD.next,sd);AUD.next+=sd;AUD.step=(AUD.step+1)%s.len}}
function padV(d,t,f,dur,v){const c=AUD.ctx,lp=c.createBiquadFilter(),g=c.createGain();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.4;lp.connect(g);g.connect(d);g.connect(AUD.echo);
 for(const dt of [-7,7]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+.8)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.35);g.gain.setTargetAtTime(0,t+dur-.1,.25)}

 const L=s.lm[i];if(L&&L.n!=='r'){const f=nf(L.n),du=L.l*sd*.95;voice(d,t,f,du,{w:'sine',v:s.lv,a:.035,s:.85,d:.2,r:.14,echo:1,vib:.5});voice(d,t,f*2,du,{w:'tri',v:s.lv*.12,a:.05,s:.7,d:.2,r:.1})}
 if(b===0){const bd=sd*16;ch.iv.forEach(iv=>padV(d,t,semi(ch.r*2,iv),bd,.028))}
 const bc=s.bass[b];if(bc&&bc!=='.'){const f=bc==='R'?ch.r:bc==='O'?ch.r*2:bc==='5'?semi(ch.r,ch.iv[2]):ch.r;voice(d,t,f,sd*1.8,{w:'sine',v:.3,s:.8,d:.2,r:.08});voice(d,t,f*2,sd*1.2,{w:'tri',v:.05,s:.5,d:.1,r:.05})}

 for(const k in s.dr){if(s.dr[k][b]&&s.dr[k][b]!=='.')softDrum(k,t,k==='h'&&(b&3)?.7:1)}}
function musStep(s,i,t,sd){if(s.style==='soft'){musSoft(s,i,t,sd);return}const bar=i>>4,b=i&15,ch=s.ch[bar],d=AUD.mus;
 const L=s.lm[i];if(L&&L.n!=='r')voice(d,t,nf(L.n),L.l*sd*.95,{w:s.lw,v:s.lv,s:.7,d:.15,r:.08,echo:1,vib:s.vib?1:0,det:s.vib?(Math.random()*8-4):0});

/* ===== Skillbaum-Suche ===== */
function nodeSearchText(n){try{return (nodeName(n)+' '+nodeType(n)+' '+nodeLines(n).join(' ')).toLowerCase()}catch(e){return ''}}
function treeSearch(q){TV.q=q;TV.hits=null;TV.hi=-1;const t=(q||'').trim().toLowerCase();
 if(t.length>=2){const parts=t.split(/\s+/);TV.hits=TREE.nodes.filter(n=>n.t!=='start'&&parts.every(p=>nodeSearchText(n).includes(p))).map(n=>n.id)}
 const c=$('#tqn');if(c)c.textContent=TV.hits?`${TV.hits.length} Treffer`:'';drawTree()}
function treeJump(dir){if(!TV.hits||!TV.hits.length)return;TV.hi=(TV.hi+dir+TV.hits.length)%TV.hits.length;const n=TREE.nodes[TV.hits[TV.hi]];
 TV.z=Math.max(TV.z,.9);TV.x=-n.x*TV.z;TV.y=-n.y*TV.z;TV.sel=n;updatePathPreview();drawTree();updateNInfo();const c=$('#tqn');if(c)c.textContent=`${TV.hi+1} / ${TV.hits.length}`}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='tq')treeSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='tq'){if(e.key==='Enter'){treeJump(e.shiftKey?-1:1);e.preventDefault()}if(e.key==='Escape'){e.target.value='';treeSearch('');e.target.blur()}e.stopPropagation()}},true);

/* ===== Lebendige Figuren: Animation & Partikel (nur Darstellung – nutzt nie den Spiel-Zufall R) ===== */
const AN={on:true,map:new WeakMap(),parts:[],raf:null,last:0,amb:0};
try{const v=localStorage.getItem('rl-anim');AN.on=v===null?!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches):v==='1'}catch(e){}
function anSet(on){AN.on=on;try{localStorage.setItem('rl-anim',on?'1':'0')}catch(e){}document.body.classList.toggle('noanim',!on);if(on)anKick();else{AN.parts=[];if(typeof render==='function')render()}}
const arnd=Math.random; // ausdrücklich NICHT R(): Animationen dürfen den Spielablauf nicht beeinflussen
function anOf(o){let a=AN.map.get(o);if(!a){a={rx:o.x,ry:o.y,tx:o.x,ty:o.y,face:1,hop:-9,flash:-9,ph:arnd()*6.28};AN.map.set(o,a)}return a}
const AN_STEP=140; // ms pro Schritt
function anStep(o,now,dt){const a=anOf(o);if(a.tx!==o.x||a.ty!==o.y){const d=Math.abs(o.x-a.rx)+Math.abs(o.y-a.ry);if(d>2.5||!AN.on){a.rx=o.x;a.ry=o.y;a.t0=-9}else{a.fx=a.rx;a.fy=a.ry;a.t0=now;a.hop=now;if(o.x!==a.tx)a.face=o.x<a.tx?-1:1;a.land=1}a.tx=o.x;a.ty=o.y}
 if(AN.on&&a.t0>0){const k=Math.min(1,(now-a.t0)/AN_STEP),e=1-(1-k)*(1-k);a.rx=a.fx+(o.x-a.fx)*e;a.ry=a.fy+(o.y-a.fy)*e;if(k>=1)a.t0=-9}else{a.rx=o.x;a.ry=o.y}
 if(a.land&&now-a.hop>AN_STEP){a.land=0;if(AN.on)anDust(a.rx,a.ry)}return a}
function anFlash(x,y){if(!G)return;const now=performance.now();if(G.p.x===x&&G.p.y===y){anOf(G.p).flash=now;return}for(const e of G.enemies)if(e.x===x&&e.y===y){anOf(e).flash=now;return}}
// weiße Silhouette eines Sprites (für Treffer-Blitz)
const SPRW=new Map();function sprWhite(key){if(SPRW.has(key))return SPRW.get(key);const c=sprCanvas(key);if(!c){SPRW.set(key,null);return null}const w=document.createElement('canvas');w.width=c.width;w.height=c.height;const x=w.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,w.width,w.height);SPRW.set(key,w);return w}
// Figur zeichnen: Atmen, Hüpfer, Blickrichtung, Blitz
function anDraw(ctx,key,a,cx,cy,size,alpha,now,opt={}){const c=sprCanvas(key);if(!c)return;const hw=c.width/2,z=Math.max(hw,Math.round(size*1.35/hw)*hw);
 let ox=a.rx*TS-cx+TS/2,oy=a.ry*TS-cy+TS/2,sx=1,sy=1,lift=0;
 if(AN.on){const br=Math.sin(now/650+a.ph);sy=1+.035*br;sx=1-.02*br;const hk=(now-a.hop)/AN_STEP;if(hk>=0&&hk<1){lift=Math.sin(Math.PI*hk)*TS*.16}else if(hk>=1&&hk<1.6){const q=1-(hk-1)/.6;sy*=1-.12*q;sx*=1+.1*q}
  if(opt.float)lift+=(Math.sin(now/500+a.ph)*.5+.5)*TS*.08;const fk=(now-a.flash)/180;if(fk>=0&&fk<1)ox+=Math.sin(fk*40)*3*(1-fk)}
 const p=Math.max(1,z/hw/2);lift=Math.round(lift/p)*p;
 // Schatten (schrumpft beim Hüpfen)
 if(opt.shadow!==false){const sh=1-Math.min(.45,lift/(TS*.35));ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(ox,oy+TS*.34,TS*(opt.big?.42:.3)*sh,TS*.1*sh,0,0,7);ctx.fill()}
 ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;const bottom=oy+z/2-lift;ctx.translate(Math.round(ox),Math.round(bottom));ctx.scale((opt.noflip?1:a.face)*sx,sy);ctx.drawImage(c,-z/2,-z,z,z);
 const fk=(now-a.flash)/180;if(AN.on&&fk>=0&&fk<1){const w=sprWhite(key);if(w){ctx.globalAlpha=alpha*(1-fk)*.9;ctx.drawImage(w,-z/2,-z,z,z)}}ctx.restore();ctx.globalAlpha=1;
 return {x:ox,y:oy-lift}}
// ---- Partikel ----
function anPart(o){if(AN.parts.length<220)AN.parts.push(Object.assign({t0:performance.now(),life:600,vx:0,vy:0,s:3,g:0,glow:0},o))}
function anDust(x,y){const c=SC&&SC.id==='island'?'#e9d3a0':'#9aa0b4';for(let i=0;i<4;i++)anPart({x:(x+.5)*TS+(arnd()-.5)*TS*.4,y:(y+.84)*TS,vx:(arnd()-.5)*40,vy:-arnd()*30,life:380+arnd()*200,s:2+arnd()*2,c,g:60})}
function anAmbient(now,cx,cy,W,H){if(!G||!G.tier)return;const ti=Math.max(0,SC.tiers.indexOf(G.tier)),sc=SC.id;if(now-AN.amb<90)return;AN.amb=now;
 const rx=()=>cx+arnd()*W,ry=()=>cy+arnd()*H;
 if(sc==='island'){if(ti===0){anPart({x:rx(),y:ry(),vx:18+arnd()*20,vy:-2,life:2600,s:2,c:'#fff7dc',a:.5})}
  else if(ti===1){if(arnd()<.6)anPart({x:rx(),y:ry(),vx:(arnd()-.5)*12,vy:(arnd()-.5)*12,life:3000,s:3,c:'#d8ff6a',glow:1,blink:1})}
  else{anPart({x:rx(),y:cy+H+5,vx:(arnd()-.5)*14,vy:-30-arnd()*40,life:3200,s:3,c:arnd()<.5?'#ff8a2a':'#ffcf4a',glow:1})}}
 else{if(ti===0){if(arnd()<.7)anPart({x:rx(),y:ry(),vx:(arnd()-.5)*6,vy:-3-arnd()*4,life:3800,s:2,c:'#d6d2c0',a:.45})}
  else if(ti===1){if(arnd()<.35)anPart({x:rx(),y:cy-5,vx:8+arnd()*10,vy:22+arnd()*16,life:4200,s:4,c:'#f4f4f4',a:.55,rot:1})}
  else{if(arnd()<.6)anPart({x:rx(),y:ry(),vx:(arnd()-.5)*5,vy:-4,life:3600,s:2,c:'#ffd24a',glow:1,blink:1})}}}

 if(e.code&&e.code.startsWith('Numpad')){const n=e.code.slice(6);if(n==='5'){waitTurn();e.preventDefault();return}if(KEYS[n]){playerMove(...mdir(...KEYS[n]));e.preventDefault();return}}
 if(['1','2','3'].includes(k)&&!(e.code&&e.code.startsWith('Numpad'))){useAbility(+k-1);e.preventDefault();return}

{const _ba=battleAttack;battleAttack=function(){const ok=G&&G.battle&&G.battle.phase==='player'&&BTGT();if(ok){try{sfxSwing()}catch(e){}if(r3On())r3PlayerAct('atk')}AUD.pAtk=!!ok;try{return _ba.apply(this,arguments)}finally{AUD.pAtk=false;r3ActDone()}};
